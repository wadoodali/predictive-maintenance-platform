services:

  api:
    build: .
    container_name: predictive-maintenance-api
    command: python -m uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  dashboard:
    build: .
    container_name: predictive-maintenance-dashboard
    command: python -m streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      - api